plugins {
    id "com.android.application"
}

android {
    namespace "com.handoff.cover"
    compileSdk 37

    defaultConfig {
        applicationId "com.handoff.cover"
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // signed with the debug key so it can be installed directly
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
